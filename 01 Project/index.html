<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        body{
            background-color: #ab32d0;
        }
      #heading {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          "Open Sans",
          "Helvetica Neue",
          sans-serif;
        font-size: 50px;
        text-align: center;
        margin-bottom: 10px;

      }
      #main {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          "Open Sans",
          "Helvetica Neue",
          sans-serif;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        gap: 10px;
        height: 60%;
        width: 60%;
        background-color: pink;
        padding: 30px;
        text-align: center;
        border-radius: 20px;
      }
      #container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }
      #input {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }
      label {
        font-size: 30px;
        font-weight: 700;
      }
      #first,
      #second {
        padding: 13px 20px;
        border-radius: 10px;
        outline: none;
        border: none;
        font-size: 20px;
      }
      #button {
        width: 34%;
        margin-top: 10px;
        padding: 20px 45px;
        border-radius: 15px;
        outline: none;
        border: none;
        background-color: rgb(51, 79, 206);
        font-size: 24px;
        font-weight: 500;
      }
      .result_style{
        background-color: rgb(80, 234, 224);
        padding: 10px 20px;
        border-radius: 10px;
        margin-top: 20px;
        font-size: 30px;
        
      }
    </style>
  </head>
  <body>
    <h1 id="heading">Calculate the percentage of your love ❤️</h1>
    <div id="main">
      <div id="container">
        <div id="input">
          <div id="first-person">
            <label for="first">Enter first person name : </label>
            <input
              type="text"
              spellcheck="false"
              id="first"
              placeholder="Enter name..."
            />
          </div>
          <div id="second-person">
            <label for="second">Enter second person name : </label>
            <input
              type="text"
              spellcheck="second"
              id="second"
              placeholder="Enter name..."
            />
          </div>
        </div>
        <button id="button">Calculate love ❤️</button>
        <div id="result" >  </div>
      </div>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
