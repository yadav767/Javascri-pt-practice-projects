<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Strength checker</title>
    <style>
        body{
            background-color: #6b5656;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            
        }
      #container {
        border-radius: 30px;
        display: flex;
        align-items: center;
        padding: 20px;
        gap: 20px;
        justify-content: center;
        width: 650px;
        height: 400px;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background-color: rgb(64, 194, 213);
      }
      label{
        font-size: 30px;
        font-weight: 700;
      }
      #password{
        padding: 12px 20px;
        border: none;
        outline: none;
        font-size: 23px;
        border-radius: 20px;
      }
      .strength{
        font-size: 30px;
        text-align: right;
        margin-right: 200px;
        color: red;
        margin-top: 20px;
        font-weight: 600;
      }
      h1{
        text-align: center;
        font-size: 60px;
        color: white;
        font-weight: 400;
      }
    </style>
  </head>
  <body>
      <h1>Password Strength Checker</h1>
    <div id="container">
      <div id="input">
        <label for="password">Enter your password : </label>
        <input type="text" id="password" />
        <div class="strength">Weak</div>
      </div>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
